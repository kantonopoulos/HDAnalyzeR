# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # The site builds the reference index, which loads the Bioconductor
          # dependencies via the package examples.
          bioc-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # callr and processx are named explicitly because the site build has
          # been failing inside their subprocess management, not in this
          # package: pick up their newest release rather than a cached one.
          extra-packages: any::pkgdown, any::callr, any::processx, local::.
          needs: website

      # pkgdown renders every article in a callr subprocess and polls its output
      # pipes every 200 ms until it exits. Twice in a row the build has died
      # while polling the render of `classification.Rmd`, the longest article, in
      # processx's own error-decoration helpers (`chain_call()` once,
      # `assert_that()` the next time). pkgdown then cannot format that
      # condition, because it has no `$stderr`, and reports `subscript out of
      # bounds` from `wrap_rmarkdown_error()` instead of the real cause.
      #
      # Every article renders cleanly in this same runner in-process, and the
      # runner has ~14 GB of memory free, so this is not the package's code and
      # not a resource limit. Two things help: `quiet = FALSE` streams the
      # subprocess output into the log so the child's real progress is visible,
      # and the retry resumes rather than starting over.
      - name: Build site
        run: |
          build <- function(...) {
            pkgdown::build_site_github_pages(
              new_process = FALSE, install = FALSE, quiet = FALSE, ...
            )
          }

          built <- tryCatch(
            {
              build()
              TRUE
            },
            error = function(cnd) {
              message("First attempt failed: ", conditionMessage(cnd))
              FALSE
            }
          )

          if (!built) {
            # `lazy = TRUE` skips the articles whose HTML is newer than their
            # Rmd, and `clean = FALSE` keeps them, so the retry picks up where
            # the crash left off instead of re-rendering everything.
            message("Retrying, resuming from the articles that already built.")
            build(clean = FALSE, lazy = TRUE)
          }
        shell: Rscript {0}

      - name: Runner resources
        if: always()
        run: |
          free -h || true
          df -h . || true

      # Re-render in this process, where the error and its traceback survive.
      # Only on failure, so a healthy build pays nothing for it.
      - name: Re-render articles to surface the real error
        if: failure()
        run: |
          articles <- list.files("vignettes", pattern = "[.]Rmd$", full.names = TRUE)
          cat("found ", length(articles), " articles\n", sep = "")
          for (rmd in articles) {
            cat("\n==== ", rmd, " ====\n", sep = "")
            elapsed <- system.time(
              rmarkdown::render(rmd, output_dir = tempdir(), quiet = TRUE)
            )[["elapsed"]]
            cat("rendered in ", round(elapsed), "s\n", sep = "")
          }
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
