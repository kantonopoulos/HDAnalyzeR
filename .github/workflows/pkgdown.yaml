# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # The site builds the reference index, which loads the Bioconductor
          # dependencies via the package examples.
          bioc-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # `build_articles()` renders each article in a callr subprocess and polls
      # it every 200 ms. That poll loop has now died three times on
      # `classification.Rmd`, the longest article, at a different chunk each
      # time. pkgdown cannot report the real cause, because
      # `wrap_rmarkdown_error()` does `strsplit(cnd$stderr, ...)[[1]]` and the
      # condition has no `$stderr`, so the log only ever shows `subscript out of
      # bounds` from the formatter itself.
      #
      # Rendering every article in this process instead removes the subprocess,
      # the poll loop and that error formatter in one go: all seven articles
      # render cleanly in a single R session on this same runner. pkgdown
      # already supports it -- `build_rmarkdown_article()` skips callr when
      # `new_process` is FALSE -- but nothing exposes the argument: the site
      # build reaches it through `build_articles()`, which walks over
      # `build_article()` without passing `new_process`, and `build_article()`
      # then hands its own default down. So `build_article()` is the one place
      # where changing the default actually takes effect. If a render does fail
      # now, the error and its traceback reach the log intact.
      - name: Build site
        run: |
          render_in_process <- pkgdown::build_article
          formals(render_in_process)$new_process <- FALSE
          assignInNamespace("build_article", render_in_process, ns = "pkgdown")

          pkgdown::build_site_github_pages(
            new_process = FALSE, install = FALSE, quiet = FALSE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
