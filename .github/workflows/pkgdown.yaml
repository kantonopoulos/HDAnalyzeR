# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # The site builds the reference index, which loads the Bioconductor
          # dependencies via the package examples.
          bioc-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders every article in a callr subprocess. When that
      # subprocess dies without writing to stderr (killed, out of memory, or
      # crashed in a compiled dependency), pkgdown's own error formatter fails
      # with `subscript out of bounds` in wrap_rmarkdown_error() and the real
      # cause never reaches the log. The two enrichment articles peak at around
      # 3 GB each because clusterProfiler loads the whole GO database, so a
      # memory problem is worth ruling in or out explicitly.
      - name: Runner resources
        if: always()
        run: |
          free -h || true
          df -h . || true

      # Re-render in this process, where the error and its traceback survive.
      # Only on failure, so a healthy build pays nothing for it.
      - name: Re-render articles to surface the real error
        if: failure()
        run: |
          for (rmd in list.files("vignettes", pattern = "[.]Rmd$", full.names = TRUE)) {
            cat("\n==== ", rmd, " ====\n", sep = "")
            elapsed <- system.time(
              rmarkdown::render(rmd, output_dir = tempdir(), quiet = TRUE)
            )[["elapsed"]]
            cat("rendered in ", round(elapsed), "s\n", sep = "")
          }
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
